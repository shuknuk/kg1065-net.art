<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idle Hours</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="screen">
    <div class="window sunset">
      <div class="bar">o o o</div>
      <div class="sun"></div>
      <div class="ground"></div>
    </div>

    <div class="window notes">
      <div class="bar">o o o</div>
      <div class="line"></div>
      <div class="line short"></div>
      <div class="line"></div>
    </div>

    <div class="window circles">
      <div class="bar">o o o</div>
      <div class="circle"></div>
      <div class="circle pink"></div>
      <div class="circle"></div>
    </div>

    <div class="title">
      <h1>Idle Hours</h1>
      <p>Three windows left open.</p>
    </div>
    <p class="instructions">Move your mouse onto the page to start the screensaver.</p>
  </div>
</body>
</html>
